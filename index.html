<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="健身菜單">
<meta name="theme-color" content="#0b0d12">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:; manifest-src 'none'; base-uri 'none'; form-action 'none'">
<title>健身菜單</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #0b0d12;
    --card: #161a22;
    --card2: #1e2330;
    --line: #2a3040;
    --text: #f3f5f9;
    --muted: #8b93a7;
    --accentA: #c97a70;   /* 胸肩背組：低飽和磚紅 */
    --accentB: #6f8fc4;   /* 上下肢組：低飽和霧藍 */
    --accent: var(--accentA);
    --onAccent: #fff;
    --radius: 20px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f2f3f7;
      --card: #ffffff;
      --card2: #eceef3;
      --line: #dde0e8;
      --text: #10131a;
      --muted: #666e80;
      --accentA: #b0685f;
      --accentB: #5a78ab;
    }
  }
  body[data-group="B"] { --accent: var(--accentB); }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
    font-size: 18px;
    line-height: 1.35;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    padding: calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 16px)
             calc(env(safe-area-inset-bottom) + 28px) calc(env(safe-area-inset-left) + 16px);
    min-height: 100vh;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---------- 頁首 ---------- */
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin: 8px 2px 16px; }
  .eyebrow { font-size: 15px; font-weight: 600; letter-spacing: .1em; color: var(--muted); }
  h1 { margin: 4px 0 0; font-size: 32px; font-weight: 800; }
  h1 .tag { color: var(--accent); }
  .icon-btn { flex: none; width: 52px; height: 52px; border-radius: 16px; background: var(--card); display: grid; place-items: center; }
  .icon-btn:active { background: var(--card2); }
  .icon-btn svg { width: 26px; height: 26px; stroke: var(--text); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .done-btn { flex: none; height: 52px; padding: 0 22px; border-radius: 16px; background: var(--accent); color: var(--onAccent); font-size: 19px; font-weight: 800; }

  /* ---------- 本週 ---------- */
  .week { background: var(--card); border-radius: var(--radius); padding: 14px 10px 12px; margin-bottom: 16px; }
  .week-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 6px 10px; }
  .week-head b { font-size: 18px; }
  .week-head span { font-size: 16px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .day { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0 8px; border-radius: 14px; min-height: 104px; }
  .day:active:not(:disabled) { background: var(--card2); }
  .day:disabled { opacity: .4; cursor: default; }
  .day .dow { font-size: 14px; color: var(--muted); font-weight: 600; }
  .day .num { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .day .mark { width: 30px; height: 30px; border-radius: 50%; border: 2px dashed var(--line); display: grid; place-items: center; }
  .day .mark svg { width: 18px; height: 18px; stroke: #fff; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .day .gname { font-size: 12px; font-weight: 700; line-height: 1; min-height: 12px; }
  .day[data-g="A"] .mark { background: var(--accentA); border: 0; }
  .day[data-g="B"] .mark { background: var(--accentB); border: 0; }
  .day[data-g="A"] .gname { color: var(--accentA); }
  .day[data-g="B"] .gname { color: var(--accentB); }
  .day.today { background: var(--card2); box-shadow: inset 0 0 0 2px var(--muted); }
  .day.today .dow { color: var(--text); }

  /* ---------- 分組切換 ---------- */
  .switch { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--card); padding: 6px; border-radius: 22px; margin-bottom: 16px; }
  .switch button { min-height: 60px; border-radius: 17px; font-size: 21px; font-weight: 800; color: var(--muted); transition: background .18s, color .18s; }
  .switch button[aria-pressed="true"] { color: var(--onAccent); }
  .switch button[data-g="A"][aria-pressed="true"] { background: var(--accentA); }
  .switch button[data-g="B"][aria-pressed="true"] { background: var(--accentB); }

  /* ---------- 菜單表格（主畫面） ---------- */
  .menu { background: var(--card); border-radius: var(--radius); overflow: hidden; }
  .mrow { display: grid; grid-template-columns: 1.55fr 1.15fr .8fr .8fr; align-items: center; min-height: 76px; padding: 0 16px; border-top: 1px solid var(--line); }
  .mrow.mhead { min-height: 44px; border-top: 0; background: var(--card2); font-size: 15px; font-weight: 700; color: var(--muted); }
  .mrow > div { text-align: center; }
  .mrow > div:first-child { text-align: left; }
  .mname { font-size: 23px; font-weight: 800; }
  .mval { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .mval small { font-size: 14px; font-weight: 600; color: var(--muted); margin-left: 2px; }
  .mval .note { display: block; font-size: 12px; font-weight: 700; color: var(--muted); line-height: 1; margin-top: 2px; }
  .mval.empty { color: var(--muted); font-weight: 600; }
  .mval.acc { color: var(--accent); }

  .check-today { width: 100%; margin-top: 16px; min-height: 64px; border-radius: 18px; background: var(--accent); color: var(--onAccent); font-size: 21px; font-weight: 800;
                 display: flex; align-items: center; justify-content: center; gap: 10px; }
  .check-today svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .check-today.is-done { background: var(--card); color: var(--text); box-shadow: inset 0 0 0 2px var(--accent); }

  /* ---------- 設定頁 ---------- */
  .list { display: grid; gap: 14px; }
  .card { background: var(--card); border-radius: var(--radius); padding: 18px 16px 16px; }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
  .name { font-size: 24px; font-weight: 800; }
  .step-hint { font-size: 14px; color: var(--muted); font-weight: 600; }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .label { width: 44px; flex: none; font-size: 17px; color: var(--muted); font-weight: 600; }
  .stepper { flex: 1; display: grid; grid-template-columns: 60px 1fr 60px; align-items: center; background: var(--card2); border-radius: 16px; overflow: hidden; }
  .stepper button { height: 60px; font-size: 32px; font-weight: 500; }
  .stepper button:active { background: var(--line); }
  .stepper button:disabled { opacity: .3; }
  .weight { text-align: center; font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .weight small { font-size: 16px; font-weight: 600; color: var(--muted); margin-left: 3px; }
  .weight .note { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-top: -4px; }
  .weight .unset { font-size: 20px; font-weight: 700; color: var(--muted); }
  .seg { flex: 1; display: grid; gap: 6px; background: var(--card2); padding: 5px; border-radius: 16px; }
  .seg.c4 { grid-template-columns: repeat(4, 1fr); }
  .seg.c2 { grid-template-columns: repeat(2, 1fr); }
  .seg button { height: 50px; border-radius: 12px; font-size: 22px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--onAccent); }

  footer { margin-top: 26px; text-align: center; }
  .reset { color: var(--muted); font-size: 16px; padding: 12px 18px; border-radius: 12px; }
  .reset:active { background: var(--card); }
  .warn { margin-top: 12px; font-size: 14px; color: var(--muted); text-align: center; }

  .hbtns { display: flex; gap: 10px; flex: none; }

  /* ---------- 歷史紀錄（月曆） ---------- */
  .cal { background: var(--card); border-radius: var(--radius); padding: 14px 10px 12px; }
  .cal-nav { display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; margin-bottom: 8px; }
  .cal-nav button { height: 52px; border-radius: 14px; font-size: 28px; }
  .cal-nav button:active:not(:disabled) { background: var(--card2); }
  .cal-nav button:disabled { opacity: .25; }
  .cal-title { text-align: center; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr) 52px; row-gap: 6px; column-gap: 2px; align-items: center; }
  .cal-h { text-align: center; font-size: 14px; font-weight: 700; color: var(--muted); padding: 4px 0; }
  .cal-h.wk { font-size: 12px; }
  .cd { height: 48px; display: grid; place-items: center; border-radius: 50%; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; width: 46px; margin: 0 auto; }
  .cd.out { color: var(--muted); opacity: .35; font-weight: 500; }
  .cd:disabled { cursor: default; }
  .cd.future { color: var(--muted); opacity: .5; }
  .cd[data-g="A"] { background: var(--accentA); color: #fff; opacity: 1; }
  .cd[data-g="B"] { background: var(--accentB); color: #fff; opacity: 1; }
  .cd.today { box-shadow: inset 0 0 0 2px var(--text); }
  .cd[data-g].today { box-shadow: inset 0 0 0 3px var(--bg); outline: 2px solid var(--text); }
  .wkc { text-align: center; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; border-radius: 10px; padding: 6px 0; background: var(--card2); color: var(--muted); }
  .wkc.full { color: var(--text); }
  .wkc.none { background: none; }
  .cal-sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .stat { background: var(--card); border-radius: 16px; padding: 12px 8px; text-align: center; }
  .stat b { display: block; font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 14px; color: var(--muted); font-weight: 600; }
  .stat.a b { color: var(--accentA); }
  .stat.b b { color: var(--accentB); }
  .legend { display: flex; justify-content: center; gap: 18px; margin-top: 14px; font-size: 15px; color: var(--muted); }
  .legend i { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: -2px; margin-right: 6px; }
  .hint { text-align: center; font-size: 14px; color: var(--muted); margin-top: 10px; }

  /* ---------- 本週體重 ---------- */
  .bw-chip { width: 100%; margin-top: 10px; min-height: 48px; border-radius: 14px; background: var(--card2);
             display: flex; align-items: center; justify-content: space-between; padding: 0 14px; font-size: 17px; }
  .bw-chip b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .bw-chip.missing { color: var(--muted); box-shadow: inset 0 0 0 2px var(--line); background: none; }
  .bw-chip.missing b { color: var(--accent); font-size: 17px; }

  /* ---------- 歷史：體重與詳細紀錄 ---------- */
  .sec-title { font-size: 20px; font-weight: 800; margin: 24px 4px 10px; }
  .bw-list { background: var(--card); border-radius: var(--radius); overflow: hidden; }
  .bw-row { width: 100%; display: grid; grid-template-columns: 1fr auto 70px; align-items: center; gap: 8px; min-height: 56px; padding: 0 16px; border-top: 1px solid var(--line); text-align: left; }
  .bw-row:first-child { border-top: 0; }
  .bw-row:active { background: var(--card2); }
  .bw-row .wk { font-size: 17px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bw-row .v { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .bw-row .v small { font-size: 14px; color: var(--muted); margin-left: 2px; }
  .bw-row .d { text-align: right; font-size: 16px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .empty-note { text-align: center; color: var(--muted); font-size: 16px; padding: 18px; }

  /* ---------- 詳細紀錄編輯 ---------- */
  .ghost-btn { flex: none; height: 52px; padding: 0 18px; border-radius: 16px; background: var(--card); font-size: 18px; font-weight: 700; color: var(--muted); }
  .lcard { background: var(--card); border-radius: var(--radius); padding: 16px 14px 14px; }
  .lcard .card-head { margin-bottom: 8px; }
  .plan { font-size: 15px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
  .shead, .srow { display: grid; grid-template-columns: minmax(24px, 40px) minmax(0, 1fr) minmax(0, 1fr) minmax(28px, 36px); gap: 6px; align-items: center; }
  .shead { font-size: 13px; font-weight: 700; color: var(--muted); text-align: center; padding: 2px 0 4px; }
  .srow { margin-top: 6px; }
  .sidx { font-size: 16px; font-weight: 700; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
  .mini { display: grid; grid-template-columns: minmax(30px, 42px) minmax(0, 1fr) minmax(30px, 42px); align-items: center; background: var(--card2); border-radius: 12px; overflow: hidden; }
  .mini button { height: 50px; font-size: 26px; }
  .mini button:active { background: var(--line); }
  .mini button:disabled { opacity: .3; }
  .mini .val { text-align: center; font-size: 21px; overflow: hidden; white-space: nowrap; font-weight: 800; font-variant-numeric: tabular-nums; }
  .mini .val.changed { color: var(--accent); }
  .del { height: 44px; border-radius: 12px; font-size: 22px; color: var(--muted); }
  .del:active { background: var(--card2); }
  .add-set { width: 100%; margin-top: 10px; height: 46px; border-radius: 12px; font-size: 17px; font-weight: 700; color: var(--accent); box-shadow: inset 0 0 0 2px var(--line); }
  @media (max-width: 359px) {
    .shead { display: none; }
    .srow { grid-template-columns: 28px minmax(0, 1fr) 32px; grid-template-areas: "i w d" "i r d"; row-gap: 6px; margin-top: 12px; }
    .srow .sidx { grid-area: i; }
    .srow .mini:nth-of-type(2) { grid-area: w; }
    .srow .mini:nth-of-type(3) { grid-area: r; }
    .srow .del { grid-area: d; }
    .mini { grid-template-columns: 48px minmax(0, 1fr) 48px; }
    .mini .val::after { content: attr(data-unit); font-size: 13px; color: var(--muted); margin-left: 3px; }
  }
  .skip-note { text-align: center; color: var(--muted); font-size: 15px; padding: 8px 0 2px; }

  /* 某天的紀錄摘要（底部選單內） */
  .day-sum { text-align: left; background: var(--card2); border-radius: 14px; padding: 10px 14px; margin: -4px 0 14px; font-size: 16px; line-height: 1.55; }
  .day-sum b { display: inline-block; min-width: 5.2em; }
  .day-sum span { color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ---------- 筆記 ---------- */
  .sheet { max-height: calc(100vh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .day-note { text-align: left; border-radius: 14px; padding: 12px 14px; margin: -4px 0 14px; font-size: 17px; line-height: 1.6;
              white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: inset 3px 0 0 var(--accent); background: var(--card2); }
  .day-note .lbl { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; white-space: normal; }
  .note-area { width: 100%; min-height: 150px; resize: vertical; border-radius: 16px; border: 2px solid var(--line); background: var(--card2); color: var(--text);
               font: inherit; font-size: 18px; line-height: 1.55; padding: 12px 14px; -webkit-user-select: text; user-select: text; }
  .note-area:focus { outline: none; border-color: var(--accent); }
  .note-count { text-align: right; font-size: 13px; color: var(--muted); margin: 4px 2px 10px; font-variant-numeric: tabular-nums; }
  .log-note { background: var(--card); border-radius: var(--radius); padding: 16px 14px 6px; margin-top: 14px; }
  .log-note label { display: block; font-size: 20px; font-weight: 800; margin-bottom: 10px; }
  .log-note label small { font-size: 15px; font-weight: 600; color: var(--muted); margin-left: 6px; }
  .day .num, .cd { position: relative; }
  .day.has-note .num::after, .cd.has-note::after { content: ""; position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--text); opacity: .85; }
  .day.has-note .num::after { top: -5px; left: 50%; margin-left: -4px; width: 6px; height: 6px; }
  .day.has-note .num { padding-top: 4px; }
  .day:not(.has-note) .num { padding-top: 4px; }
  .cd.has-note::after { top: 2px; right: 2px; box-shadow: 0 0 0 2px var(--card); }
  .sheet button.note-btn { background: none; box-shadow: inset 0 0 0 2px var(--line); color: var(--text); }

  /* ---------- 每週 4 次鼓勵動畫 ---------- */
  .cheer { position: fixed; inset: 0; z-index: 40; display: none; flex-direction: column; align-items: center; justify-content: center;
           background: rgba(8, 10, 14, .82); padding: calc(env(safe-area-inset-top) + 20px) 24px calc(env(safe-area-inset-bottom) + 24px); }
  .cheer.open { display: flex; animation: cheerFade .25s ease-out both; }
  .bubble { position: relative; background: #fff; color: #10131a; border-radius: 22px; padding: 16px 22px; text-align: center; max-width: 320px;
            margin-bottom: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.35); transform-origin: 50% 100%; animation: bubbleIn .45s .55s cubic-bezier(.3,1.6,.5,1) both; }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -12px; margin-left: -12px; border: 12px solid transparent; border-bottom: 0; border-top-color: #fff; }
  .bubble b { display: block; font-size: clamp(22px, 7.4vw, 30px); font-weight: 900; letter-spacing: .02em; white-space: nowrap; }
  .bubble span { display: block; font-size: clamp(16px, 5vw, 19px); font-weight: 700; margin-top: 4px; color: #3a4150; }
  .stage { position: relative; width: 230px; height: 230px; }
  .mascot { width: 230px; height: 230px; display: block; transform-origin: 50% 100%; animation: jumpIn .9s cubic-bezier(.25,.9,.3,1.2) both, idle 1.4s 1.1s ease-in-out infinite; }
  .mascot .arm-r { transform-origin: 136px 70px; animation: wave .5s 1s ease-in-out 4 alternate; }
  .mascot .arm-l { transform-origin: 64px 70px; animation: flex .6s .9s ease-in-out 2 alternate; }
  .mascot .eyes { transform-origin: 100px 98px; animation: blink 3.2s 2s infinite; }
  .spark { position: absolute; width: 34px; height: 34px; opacity: 0; animation: sparkPop 1.1s ease-out both; }
  .spark path { fill: #ffd76a; }
  .spark.s1 { left: -6px; top: 30px; animation-delay: .7s; }
  .spark.s2 { right: -4px; top: 10px; width: 26px; height: 26px; animation-delay: .85s; }
  .spark.s3 { left: 18px; top: -18px; width: 22px; height: 22px; animation-delay: 1s; }
  .spark.s4 { right: 14px; top: 120px; width: 22px; height: 22px; animation-delay: 1.15s; }
  .week-dots { display: flex; gap: 10px; margin: 18px 0 6px; }
  .week-dots i { width: 18px; height: 18px; border-radius: 50%; background: var(--accentA); animation: dotPop .35s cubic-bezier(.3,1.8,.5,1) both; }
  .week-dots i:nth-child(2n) { background: var(--accentB); }
  .week-dots i:nth-child(1) { animation-delay: 1.0s; } .week-dots i:nth-child(2) { animation-delay: 1.1s; }
  .week-dots i:nth-child(3) { animation-delay: 1.2s; } .week-dots i:nth-child(4) { animation-delay: 1.3s; }
  .cheer-go { margin-top: 22px; width: 100%; max-width: 360px; height: 62px; border-radius: 18px; background: #f3f5f9; color: #10131a; font-size: 21px; font-weight: 900;
              box-shadow: 0 5px 0 #b9bfcc; animation: rise .4s 1.2s ease-out both; }
  .cheer-go:active { transform: translateY(4px); box-shadow: 0 1px 0 #b9bfcc; }
  @keyframes cheerFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes jumpIn {
    0%   { transform: translateY(110vh) scale(.9, 1.1); }
    55%  { transform: translateY(-40px) scale(.95, 1.06); }
    72%  { transform: translateY(0) scale(1.14, .84); }
    86%  { transform: translateY(-10px) scale(.97, 1.04); }
    100% { transform: translateY(0) scale(1, 1); }
  }
  @keyframes idle { 0%, 100% { transform: translateY(0) scale(1, 1); } 45% { transform: translateY(-12px) scale(.98, 1.03); } 60% { transform: translateY(0) scale(1.05, .95); } }

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'workout-v2';
  var OLD_KEY = 'workout-v1';
  var MAX_TENTHS = 5000;          // 上限 500 kg
  var KEEP_DAYS = 730;            // 打勾紀錄保留約兩年，更舊的自動刪除
  var WEEK_GOAL = 4;
  var REPS = [6, 8, 10, 12];
  var SETS = [3, 4];
  var DOW = ['日', '一', '二', '三', '四', '五', '六'];
  var MAX_SETS = 10;
  var MAX_NOTE = 1000;
  var CHEERS = [
    '連續撐了一整週，超強！',
    '說到做到，這週的你很帥！',
    '肌肉正在默默變強中 💪',
    '穩定才是最強的天賦！',
    '這週的努力，下週的力量！',
    '四次全勤，給自己一個讚！'
  ];
  var MAX_REPS = 99;
  var BW_MIN = 200, BW_MAX = 3000;   // 體重 20–300 kg（0.1 kg 單位）

  var GROUPS = {
    A: { title: '胸肩背組' },
    B: { title: '上下肢組' }
  };

  // 重量以「0.1 kg」為單位的整數儲存，避免浮點誤差；step 同樣單位
  var EXERCISES = [
    { id: 'db_bench',  g: 'A', name: '啞鈴臥推', w: 175, step: 25, r: 10, s: 3 },
    { id: 'incline',   g: 'A', name: '上斜臥推', w: 150, step: 25, r: 8,  s: 4 },
    { id: 'pullup',    g: 'A', name: '引體向上', w: 150, step: 10, r: 8,  s: 3 },
    { id: 'row',       g: 'A', name: '坐姿划船', w: 300, step: 10, r: 8,  s: 4 },
    { id: 'squat',     g: 'B', name: '槓鈴深蹲', w: 100, step: 25, r: 8,  s: 4, note: '每邊' },
    { id: 'deadlift',  g: 'B', name: '硬拉',     w: 0,   step: 25, r: 8,  s: 3 },
    { id: 'lat_raise', g: 'B', name: '側平舉',   w: 75,  step: 25, r: 12, s: 3 },
    { id: 'curl',      g: 'B', name: '彎舉',     w: 100, step: 25, r: 8,  s: 4 }
  ];

  // ---------- 日期 ----------
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function keyOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function today() { var d = new Date(); d.setHours(0, 0, 0, 0); return d; }
  function weekDays(ref) {            // 週一到週日
    var start = new Date(ref);
    var offset = (start.getDay() + 6) % 7;
    start.setDate(start.getDate() - offset);
    var out = [];
    for (var i = 0; i < 7; i++) { var d = new Date(start); d.setDate(start.getDate() + i); out.push(d); }
    return out;
  }
  function md(d) { return (d.getMonth() + 1) + '/' + d.getDate(); }
  function parseKey(k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function weekKey(d) { return keyOf(weekDays(d)[0]); }   // 該週週一的日期當作週的代號

  // ---------- 儲存（全部包 try/catch） ----------
  var storageOK = true;
  function readKey(k) {
    try { return JSON.parse(localStorage.getItem(k) || 'null'); }
    catch (e) { if (e instanceof SyntaxError) return null; storageOK = false; return null; }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { storageOK = false; }
    document.getElementById('storageWarn').hidden = storageOK;
  }

  function defaults() {
    var ex = {};
    EXERCISES.forEach(function (e) { ex[e.id] = { w: e.w, r: e.r, s: e.s }; });
    return { group: 'A', ex: ex, log: {}, detail: {}, bw: {}, note: {}, cheer: {} };
  }

  function validW(e, w) { return Number.isInteger(w) && w >= 0 && w <= MAX_TENTHS; }

  function sanitize(raw) {
    var st = defaults();
    if (!raw || typeof raw !== 'object') return st;
    if (raw.group === 'A' || raw.group === 'B') st.group = raw.group;
    if (raw.ex && typeof raw.ex === 'object') {
      EXERCISES.forEach(function (e) {
        var v = raw.ex[e.id];
        if (!v || typeof v !== 'object') return;
        if (validW(e, v.w)) st.ex[e.id].w = v.w;
        if (REPS.indexOf(v.r) !== -1) st.ex[e.id].r = v.r;
        if (SETS.indexOf(v.s) !== -1) st.ex[e.id].s = v.s;
      });
    }
    if (raw.log && typeof raw.log === 'object') {
      var cutoff = today(); cutoff.setDate(cutoff.getDate() - KEEP_DAYS);
      var cutKey = keyOf(cutoff);
      Object.keys(raw.log).forEach(function (k) {
        if (/^\d{4}-\d{2}-\d{2}$/.test(k) && k >= cutKey && (raw.log[k] === 'A' || raw.log[k] === 'B')) st.log[k] = raw.log[k];
      });
    }
    // 詳細紀錄：只留有打勾的日子，且只留該組的動作
    if (raw.detail && typeof raw.detail === 'object') {
      Object.keys(st.log).forEach(function (k) {
        var d = raw.detail[k];
        if (!d || typeof d !== 'object') return;
        var clean = {};
        EXERCISES.forEach(function (e) {
          if (e.g !== st.log[k] || !Array.isArray(d[e.id])) return;
          clean[e.id] = d[e.id].filter(function (x) {
            return Array.isArray(x) && x.length === 2 && validW(e, x[0]) && Number.isInteger(x[1]) && x[1] >= 0 && x[1] <= MAX_REPS;
          }).slice(0, MAX_SETS).map(function (x) { return [x[0], x[1]]; });
        });
        st.detail[k] = clean;
      });
    }
    var cut3 = today(); cut3.setDate(cut3.getDate() - KEEP_DAYS);
    var cutKey3 = keyOf(cut3);
    if (raw.note && typeof raw.note === 'object') {
      Object.keys(raw.note).forEach(function (k) {
        var v = raw.note[k];
        if (/^\d{4}-\d{2}-\d{2}$/.test(k) && k >= cutKey3 && typeof v === 'string' && v.trim()) st.note[k] = v.slice(0, MAX_NOTE);
      });
    }
    if (raw.cheer && typeof raw.cheer === 'object') {
      Object.keys(raw.cheer).forEach(function (k) {
        if (/^\d{4}-\d{2}-\d{2}$/.test(k) && k >= cutKey3 && raw.cheer[k] === true) st.cheer[k] = true;
      });
    }
    if (raw.bw && typeof raw.bw === 'object') {
      var cut2 = today(); cut2.setDate(cut2.getDate() - KEEP_DAYS);
      var cutKey2 = keyOf(cut2);
      Object.keys(raw.bw).forEach(function (k) {
        var v = raw.bw[k];
        if (/^\d{4}-\d{2}-\d{2}$/.test(k) && k >= cutKey2 && Number.isInteger(v) && v >= BW_MIN && v <= BW_MAX) st.bw[k] = v;
      });
    }
    return st;
  }

  // 從第一版（重量以 2.5 為單位、左/右組）轉換過來
  function migrateV1(old) {
    if (!old || typeof old !== 'object') return null;
    var raw = { group: old.group === 'R' ? 'B' : 'A', ex: {} };
    if (old.ex && typeof old.ex === 'object') {
      Object.keys(old.ex).forEach(function (id) {
        var v = old.ex[id];
        if (v && Number.isInteger(v.u)) raw.ex[id] = { w: v.u * 25, r: v.r, s: v.s };
      });
    }
    return raw;
  }

  var raw = readKey(STORAGE_KEY);
  if (!raw) raw = migrateV1(readKey(OLD_KEY));
  var state = sanitize(raw);

  // 今天若已打勾，主畫面直接顯示那一組
  var todayKey = keyOf(today());
  if (state.log[todayKey]) state.group = state.log[todayKey];
  var settingsGroup = state.group;

  // ---------- 小工具 ----------
  function el(tag, props, children) {
    var n = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      if (k === 'text') n.textContent = props[k];
      else if (k === 'class') n.className = props[k];
      else n.setAttribute(k, props[k]);
    });
    (children || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function svgCheck() {
    var ns = 'http://www.w3.org/2000/svg';
    var s = document.createElementNS(ns, 'svg'); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('aria-hidden', 'true');
    var p = document.createElementNS(ns, 'path'); p.setAttribute('d', 'M5 12.5l4.5 4.5L19 7.5'); s.appendChild(p);
    return s;
  }
  function fmtKg(t) { return (t % 10 === 0) ? String(t / 10) : (t / 10).toFixed(1); }
  function byId(id) { return EXERCISES.find(function (x) { return x.id === id; }); }

  // ---------- 主畫面 ----------
  function renderWeek() {
    var t = today();
    var days = weekDays(t);
    document.getElementById('todayDate').textContent =
      t.getFullYear() + '/' + md(t) + '（' + DOW[t.getDay()] + '）';
    document.getElementById('weekRange').textContent = '本週 ' + md(days[0]) + ' – ' + md(days[6]);
    var cnt = days.filter(function (d) { return state.log[keyOf(d)]; }).length;
    document.getElementById('weekCount').textContent = '已練 ' + cnt + ' / ' + WEEK_GOAL + ' 次';
    var bwv = state.bw[weekKey(t)];
    var chip = document.getElementById('bwChip');
    chip.classList.toggle('missing', !bwv);
    chip.replaceChildren(el('span', { text: '本週體重' }), bwv ? el('b', {}, [fmtKg(bwv) + ' kg']) : el('b', { text: '還沒量，點此記錄' }));

    var box = document.getElementById('days');
    box.replaceChildren.apply(box, days.map(function (d) {
      var k = keyOf(d), g = state.log[k] || '';
      var future = d > t;
      var b = el('button', {
        type: 'button', class: 'day' + (k === todayKey ? ' today' : '') + (state.note[k] ? ' has-note' : ''),
        'data-day': k, 'data-g': g,
        'aria-label': md(d) + ' 星期' + DOW[d.getDay()] + (g ? '，已練' + GROUPS[g].title : '，未練') + (state.note[k] ? '，有筆記' : '')
      }, [
        el('span', { class: 'dow', text: DOW[d.getDay()] }),
        el('span', { class: 'num', text: String(d.getDate()) }),
        el('span', { class: 'mark' }, g ? [svgCheck()] : []),
        el('span', { class: 'gname', text: g ? GROUPS[g].title.slice(0, 3) : '' })
      ]);
      if (future) b.disabled = true;
      return b;
    }));
  }

  function renderMenu() {
    var g = state.group;
    document.body.setAttribute('data-group', g);
    document.getElementById('todayTag').textContent = GROUPS[g].title;
    document.querySelectorAll('#mainView .switch button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-g') === g));
    });

    var rows = [el('div', { class: 'mrow mhead', role: 'row' }, [
      el('div', { text: '動作' }), el('div', { text: '重量' }), el('div', { text: '次數' }), el('div', { text: '組數' })
    ])];
    EXERCISES.filter(function (e) { return e.g === g; }).forEach(function (e) {
      var v = state.ex[e.id];
      var wCell = v.w === 0
        ? el('div', { class: 'mval empty', text: '—' })
        : el('div', { class: 'mval' }, [fmtKg(v.w), el('small', { text: 'kg' }), e.note ? el('span', { class: 'note', text: e.note }) : null]);
      rows.push(el('div', { class: 'mrow', role: 'row' }, [
        el('div', { class: 'mname', text: e.name }),
        wCell,
        el('div', { class: 'mval acc', text: String(v.r) }),
        el('div', { class: 'mval acc', text: String(v.s) })
      ]));
    });
    var menu = document.getElementById('menu');
    menu.replaceChildren.apply(menu, rows);

    // 今天打勾按鈕
    var btn = document.getElementById('checkToday');
    var done = state.log[todayKey];
    btn.classList.toggle('is-done', !!done);
    btn.replaceChildren(svgCheck(), document.createTextNode(
      done ? '今天已完成：' + GROUPS[done].title + '（點此查看）' : '今天練完了，記錄並打勾'
    ));
  }

  function renderMain() { renderWeek(); renderMenu(); document.getElementById('storageWarn').hidden = storageOK; }

  // ---------- 設定頁 ----------
  function segButtons(opts, current, kind, id) {
    return opts.map(function (v) {
      return el('button', {
        type: 'button', text: String(v),
        'aria-pressed': String(v === current),
        'aria-label': (kind === 'r' ? v + ' 次' : v + ' 組'),
        'data-act': kind, 'data-id': id, 'data-v': String(v)
      });
    });
  }

  function card(e) {
    var v = state.ex[e.id];
    var weightBox = el('div', { class: 'weight', 'aria-live': 'polite' }, [
      v.w === 0 ? el('span', { class: 'unset', text: '未設定' }) : fmtKg(v.w),
      v.w === 0 ? null : el('small', { text: 'kg' }),
      e.note ? el('span', { class: 'note', text: e.note }) : null
    ]);
    var stepTxt = fmtKg(e.step);
    var minus = el('button', { type: 'button', text: '−', 'aria-label': e.name + ' 減 ' + stepTxt + ' 公斤', 'data-act': 'w', 'data-id': e.id, 'data-v': '-1' });
    var plus  = el('button', { type: 'button', text: '+', 'aria-label': e.name + ' 加 ' + stepTxt + ' 公斤', 'data-act': 'w', 'data-id': e.id, 'data-v': '1' });
    if (v.w <= 0) minus.disabled = true;
    if (v.w >= MAX_TENTHS) plus.disabled = true;

    return el('section', { class: 'card', 'data-card': e.id }, [
      el('div', { class: 'card-head' }, [
        el('div', { class: 'name', text: e.name }),
        el('div', { class: 'step-hint', text: '每次 ±' + stepTxt + ' kg' })
      ]),
      el('div', { class: 'row' }, [el('div', { class: 'label', text: '重量' }), el('div', { class: 'stepper' }, [minus, weightBox, plus])]),
      el('div', { class: 'row' }, [el('div', { class: 'label', text: '次數' }), el('div', { class: 'seg c4', role: 'group', 'aria-label': '次數' }, segButtons(REPS, v.r, 'r', e.id))]),
      el('div', { class: 'row' }, [el('div', { class: 'label', text: '組數' }), el('div', { class: 'seg c2', role: 'group', 'aria-label': '組數' }, segButtons(SETS, v.s, 's', e.id))])
    ]);
  }

  function renderSettings() {
    var g = settingsGroup;
    document.body.setAttribute('data-group', g);
    document.querySelectorAll('#settingsView .switch button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-g') === g));
    });
    var list = document.getElementById('list');
    list.replaceChildren.apply(list, EXERCISES.filter(function (e) { return e.g === g; }).map(card));
  }

  // ---------- 歷史紀錄（月曆） ----------
  var calMonth = (function () { var t = today(); return new Date(t.getFullYear(), t.getMonth(), 1); })();
  function minMonth() { var c = today(); c.setDate(c.getDate() - KEEP_DAYS); return new Date(c.getFullYear(), c.getMonth(), 1); }
  function maxMonth() { var t = today(); return new Date(t.getFullYear(), t.getMonth(), 1); }

  function renderHistory() {
    document.body.setAttribute('data-group', state.group);
    var t = today();
    var y = calMonth.getFullYear(), m = calMonth.getMonth();
    document.getElementById('calTitle').textContent = y + ' 年 ' + (m + 1) + ' 月';
    document.getElementById('prevMonth').disabled = calMonth <= minMonth();
    document.getElementById('nextMonth').disabled = calMonth >= maxMonth();

    var cells = ['一', '二', '三', '四', '五', '六', '日'].map(function (d) { return el('div', { class: 'cal-h', text: d }); });
    cells.push(el('div', { class: 'cal-h wk', text: '週次數' }));

    var first = new Date(y, m, 1);
    var cur = new Date(first); cur.setDate(1 - ((first.getDay() + 6) % 7));   // 該月第一週的週一
    var sumA = 0, sumB = 0;
    while (true) {
      var weekCnt = 0, weekHasPast = false;
      for (var i = 0; i < 7; i++) {
        var d = new Date(cur), k = keyOf(d), g = state.log[k] || '';
        var inMonth = d.getMonth() === m, future = d > t;
        if (g) weekCnt++;
        if (!future) weekHasPast = true;
        if (inMonth && g === 'A') sumA++;
        if (inMonth && g === 'B') sumB++;
        var cls = 'cd' + (inMonth ? '' : ' out') + (future ? ' future' : '') + (k === todayKey ? ' today' : '') + (state.note[k] ? ' has-note' : '');
        var b = el('button', {
          type: 'button', class: cls, 'data-day': k, 'data-g': g, text: String(d.getDate()),
          'aria-label': (d.getMonth() + 1) + '月' + d.getDate() + '日' + (g ? '，' + GROUPS[g].title : '') + (state.note[k] ? '，有筆記' : '')
        });
        if (future) b.disabled = true;
        cells.push(b);
        cur.setDate(cur.getDate() + 1);
      }
      cells.push(el('div', { class: 'wkc' + (weekCnt >= WEEK_GOAL ? ' full' : '') + (weekHasPast ? '' : ' none'), text: weekHasPast ? weekCnt + '/' + WEEK_GOAL : '' }));
      if (cur.getMonth() !== m) break;
    }
    var grid = document.getElementById('calGrid');
    grid.replaceChildren.apply(grid, cells);
    document.getElementById('sumAll').textContent = String(sumA + sumB);
    document.getElementById('sumA').textContent = String(sumA);
    document.getElementById('sumB').textContent = String(sumB);
    renderBwList();
  }

  function renderBwList() {
    var keys = Object.keys(state.bw).sort().reverse();
    var box = document.getElementById('bwList');
    if (!keys.length) { box.replaceChildren(el('div', { class: 'empty-note', text: '還沒有體重紀錄' })); return; }
    box.replaceChildren.apply(box, keys.map(function (k, i) {
      var v = state.bw[k], prev = state.bw[keys[i + 1]];
      var start = parseKey(k), end = new Date(start); end.setDate(start.getDate() + 6);
      var diff = prev ? v - prev : null;
      var dTxt = diff === null ? '' : diff === 0 ? '±0' : (diff > 0 ? '+' : '−') + fmtKg(Math.abs(diff));
      return el('button', { type: 'button', class: 'bw-row', 'data-bw': k, 'aria-label': md(start) + ' 那週體重 ' + fmtKg(v) + ' 公斤' }, [
        el('span', { class: 'wk', text: md(start) + ' – ' + md(end) }),
        el('span', { class: 'v' }, [fmtKg(v), el('small', { text: 'kg' })]),
        el('span', { class: 'd', text: dTxt })
      ]);
    }));
  }

  // ---------- 詳細訓練紀錄 ----------
  var editing = null;          // { day, g, sets: { id: [[w, r], ...] } }
  var returnView = 'main';

  function planSets(e) {
    var v = state.ex[e.id], out = [];
    for (var i = 0; i < v.s; i++) out.push([v.w, v.r]);
    return out;
  }

  function openLog(day, g) {
    var sets = {};
    var old = state.log[day] === g ? state.detail[day] : null;
    EXERCISES.filter(function (e) { return e.g === g; }).forEach(function (e) {
      sets[e.id] = (old && old[e.id]) ? old[e.id].map(function (x) { return x.slice(); }) : planSets(e);
    });
    editing = { day: day, g: g, sets: sets, note: state.note[day] || '' };
    returnView = view === 'log' ? returnView : view;
    showView('log');
  }

  function miniStepper(kind, id, i, val, text, min, max, changed) {
    var minus = el('button', { type: 'button', text: '−', 'aria-label': '減少', 'data-act': kind, 'data-id': id, 'data-i': String(i), 'data-v': '-1' });
    var plus  = el('button', { type: 'button', text: '+', 'aria-label': '增加', 'data-act': kind, 'data-id': id, 'data-i': String(i), 'data-v': '1' });
    if (val <= min) minus.disabled = true;
    if (val >= max) plus.disabled = true;
    return el('div', { class: 'mini' }, [minus, el('div', { class: 'val' + (changed ? ' changed' : ''), text: text, 'data-unit': kind === 'lw' ? 'kg' : '下' }), plus]);
  }

  function logCard(e) {
    var v = state.ex[e.id], sets = editing.sets[e.id];
    var planTxt = '計畫 ' + (v.w ? fmtKg(v.w) + 'kg · ' : '') + v.r + '×' + v.s;
    var kids = [
      el('div', { class: 'card-head' }, [el('div', { class: 'name', text: e.name }), el('div', { class: 'plan', text: planTxt })])
    ];
    if (sets.length) {
      kids.push(el('div', { class: 'shead' }, [el('span', { text: '組' }), el('span', { text: '重量 kg' + (e.note ? '（' + e.note + '）' : '') }), el('span', { text: '次數' }), el('span')]));
      sets.forEach(function (x, i) {
        kids.push(el('div', { class: 'srow' }, [
          el('div', { class: 'sidx', text: String(i + 1) }),
          miniStepper('lw', e.id, i, x[0], fmtKg(x[0]), 0, MAX_TENTHS, x[0] !== v.w),
          miniStepper('lr', e.id, i, x[1], String(x[1]), 0, MAX_REPS, x[1] !== v.r),
          el('button', { type: 'button', class: 'del', text: '×', 'aria-label': '刪除第 ' + (i + 1) + ' 組', 'data-act': 'ldel', 'data-id': e.id, 'data-i': String(i) })
        ]));
      });
    } else {
      kids.push(el('div', { class: 'skip-note', text: '這個動作今天沒做' }));
    }
    var add = el('button', { type: 'button', class: 'add-set', text: '＋ 新增一組', 'data-act': 'ladd', 'data-id': e.id });
    if (sets.length >= MAX_SETS) add.disabled = true;
    kids.push(add);
    return el('section', { class: 'lcard', 'data-lcard': e.id }, kids);
  }

  function renderLog() {
    var d = parseKey(editing.day);
    document.body.setAttribute('data-group', editing.g);
    document.getElementById('logDate').textContent = (editing.day === todayKey ? '今天 ' : '') + md(d) + '（' + DOW[d.getDay()] + '）';
    document.getElementById('logTitle').textContent = GROUPS[editing.g].title;
    var list = document.getElementById('logList');
    list.replaceChildren.apply(list, EXERCISES.filter(function (e) { return e.g === editing.g; }).map(logCard));
    var btn = document.getElementById('saveLog');
    btn.replaceChildren(svgCheck(), document.createTextNode(state.log[editing.day] ? '儲存修改' : '儲存並打勾'));
    var ta = document.getElementById('logNote');
    ta.value = editing.note;
    updateCount(ta, 'logNoteCount');
  }

  function updateCount(ta, id) { document.getElementById(id).textContent = ta.value.length + ' / ' + MAX_NOTE; }
  function setNote(day, txt) {
    txt = String(txt || '').slice(0, MAX_NOTE);
    if (txt.trim()) state.note[day] = txt; else delete state.note[day];
  }
  function weekCount(day) { return weekDays(parseKey(day)).filter(function (d) { return state.log[keyOf(d)]; }).length; }

  function saveLog() {
    var day = editing.day, g = editing.g;
    var wk = weekKey(parseKey(day));
    var firstThisWeek = weekDays(parseKey(day)).filter(function (d) { var k = keyOf(d); return k !== day && state.log[k]; }).length === 0;
    var before = weekCount(day);
    state.log[day] = g;
    state.detail[day] = editing.sets;
    setNote(day, document.getElementById('logNote').value);
    if (day === todayKey) state.group = g;
    var isThisWeek = wk === weekKey(today());
    var doCheer = isThisWeek && before < WEEK_GOAL && weekCount(day) >= WEEK_GOAL && !state.cheer[wk];
    if (doCheer) state.cheer[wk] = true;
    save();
    editing = null;
    document.getElementById('logNote').blur();
    showView(returnView);
    // 本週第一次訓練、且這週還沒量體重 → 提醒量體重
    var needBw = firstThisWeek && isThisWeek && !state.bw[wk];
    if (doCheer) showCheer(function () { if (needBw) openBw(wk, true); });
    else if (needBw) openBw(wk, true);
  }

  // ---------- 每週 4 次鼓勵動畫 ----------
  var cheerEl = document.getElementById('cheer');
  var afterCheer = null;
  function showCheer(next) {
    afterCheer = next || null;
    document.getElementById('cheerMsg').textContent = CHEERS[Math.floor(Math.random() * CHEERS.length)];
    cheerEl.classList.remove('open');
    void cheerEl.offsetWidth;            // 重新播放動畫
    cheerEl.classList.add('open');
    setTimeout(function () { document.getElementById('cheerGo').focus({ preventScroll: true }); }, 50);
  }
  document.getElementById('cheerGo').addEventListener('click', function () {
    cheerEl.classList.remove('open');
    var fn = afterCheer; afterCheer = null;
    if (fn) fn();
  });

  // ---------- 筆記 ----------
  var noteModal = document.getElementById('noteModal');
  var noteDay = null;
  function openNote(day) {
    noteDay = day;
    var d = parseKey(day);
    document.getElementById('noteTitle').textContent = (day === todayKey ? '今天 ' : '') + md(d) + '（' + DOW[d.getDay()] + '）的筆記';
    var ta = document.getElementById('noteInput');
    ta.value = state.note[day] || '';
    updateCount(ta, 'noteCount');
    document.getElementById('noteDelete').hidden = !state.note[day];
    noteModal.classList.add('open');
  }
  function closeNote() { noteModal.classList.remove('open'); noteDay = null; document.getElementById('noteInput').blur(); }

  // ---------- 體重 ----------
  var bwModal = document.getElementById('bwModal');
  var bwWeek = null;
  function openBw(wk, isReminder) {
    bwWeek = wk;
    var start = parseKey(wk), end = new Date(start); end.setDate(start.getDate() + 6);
    document.getElementById('bwTitle').textContent = isReminder ? '本週第一次訓練完成！' : '記錄體重';
    document.getElementById('bwSub').textContent = (isReminder ? '記得量一下體重・' : '') + md(start) + ' – ' + md(end) + ' 這週';
    var input = document.getElementById('bwInput');
    var cur = state.bw[wk];
    var prevKeys = Object.keys(state.bw).filter(function (k) { return k < wk; }).sort();
    input.value = cur ? fmtKg(cur) : '';
    input.placeholder = prevKeys.length ? '上次 ' + fmtKg(state.bw[prevKeys[prevKeys.length - 1]]) : '例如 70.5';
    document.getElementById('bwErr').textContent = '';
    document.getElementById('bwClear').hidden = !cur;
    bwModal.classList.add('open');
  }
  function closeBw() { bwModal.classList.remove('open'); bwWeek = null; document.getElementById('bwInput').blur(); }
  function parseBw(txt) {
    var t = String(txt).trim().replace('，', '.').replace(',', '.').replace(/\s*kg$/i, '');
    if (!/^\d{1,3}(\.\d)?$/.test(t)) return null;
    var v = Math.round(parseFloat(t) * 10);
    return (v >= BW_MIN && v <= BW_MAX) ? v : null;
  }

  // ---------- 頁面切換 ----------
  var view = 'main';
  function showView(name) {
    view = name;
    document.getElementById('mainView').hidden = name !== 'main';
    document.getElementById('settingsView').hidden = name !== 'settings';
    document.getElementById('historyView').hidden = name !== 'history';
    document.getElementById('logView').hidden = name !== 'log';
    if (name === 'settings') { settingsGroup = state.group; renderSettings(); }
    else if (name === 'history') { if (returnView !== 'history' || !calMonth) calMonth = maxMonth(); renderHistory(); }
    else if (name === 'log') renderLog();
    else renderMain();
    window.scrollTo(0, 0);
  }
  function renderCurrent() { if (view === 'history') renderHistory(); else if (view === 'main') renderMain(); }

  // ---------- 操作：主畫面 ----------
  document.querySelector('#mainView .switch').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-g]');
    if (!b) return;
    var g = b.getAttribute('data-g');
    if (g === state.group) return;
    state.group = g; save(); renderMenu();
  });

  var dayModal = document.getElementById('dayModal');
  var pickingDay = null;
  function openDay(k) {
    pickingDay = k;
    var d = parseKey(k), g = state.log[k];
    document.getElementById('dayModalText').textContent =
      (k === todayKey ? '今天 ' : '') + md(d) + '（' + DOW[d.getDay()] + '）' + (g ? '・' + GROUPS[g].title : '練了哪一組？');
    // 詳細紀錄摘要
    var sum = document.getElementById('daySum'), det = state.detail[k];
    if (g && det) {
      sum.replaceChildren.apply(sum, EXERCISES.filter(function (e) { return e.g === g; }).map(function (e) {
        var sets = det[e.id] || [];
        var txt = sets.length ? sets.map(function (x) { return x[0] ? fmtKg(x[0]) + '×' + x[1] : x[1] + '下'; }).join('、') : '沒做';
        return el('div', {}, [el('b', { text: e.name }), el('span', { text: txt })]);
      }));
      sum.hidden = false;
    } else if (g) {
      sum.replaceChildren(el('div', {}, [el('span', { text: '這天只有打勾，沒有詳細紀錄' })]));
      sum.hidden = false;
    } else sum.hidden = true;
    var noteBox = document.getElementById('dayNote'), nt = state.note[k];
    if (nt) {
      noteBox.replaceChildren(el('span', { class: 'lbl', text: g ? '心得' : '筆記' }), document.createTextNode(nt));
      noteBox.hidden = false;
    } else noteBox.hidden = true;
    document.getElementById('noteBtn').textContent = nt ? '編輯筆記' : '寫筆記';
    document.getElementById('pickA').textContent = g === 'A' ? '編輯紀錄' : (g ? '改成 胸肩背組' : '胸肩背組');
    document.getElementById('pickB').textContent = g === 'B' ? '編輯紀錄' : (g ? '改成 上下肢組' : '上下肢組');
    document.getElementById('clearDay').hidden = !g;
    dayModal.classList.add('open');
  }
  document.getElementById('days').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-day]');
    if (b && !b.disabled) openDay(b.getAttribute('data-day'));
  });
  document.getElementById('checkToday').addEventListener('click', function () {
    if (state.log[todayKey]) { openDay(todayKey); return; }
    openLog(todayKey, state.group);
  });
  dayModal.addEventListener('click', function (ev) {
    if (ev.target === dayModal) { dayModal.classList.remove('open'); return; }
    var b = ev.target.closest('button[data-pick]');
    if (!b || !pickingDay) return;
    var pick = b.getAttribute('data-pick');
    var day = pickingDay;
    dayModal.classList.remove('open');
    pickingDay = null;
    if (pick === 'A' || pick === 'B') {
      openLog(day, pick);
    } else if (pick === 'note') {
      openNote(day);
    } else if (pick === 'clear') {
      delete state.log[day];
      delete state.detail[day];
      save(); renderCurrent();
    }
  });

  document.getElementById('openSettings').addEventListener('click', function () { showView('settings'); });
  document.getElementById('closeSettings').addEventListener('click', function () { showView('main'); });
  document.getElementById('openHistory').addEventListener('click', function () { returnView = 'main'; calMonth = maxMonth(); showView('history'); });
  document.getElementById('closeHistory').addEventListener('click', function () { showView('main'); });
  document.getElementById('prevMonth').addEventListener('click', function () {
    if (calMonth > minMonth()) { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1); renderHistory(); }
  });
  document.getElementById('nextMonth').addEventListener('click', function () {
    if (calMonth < maxMonth()) { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1); renderHistory(); }
  });
  document.getElementById('calGrid').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-day]');
    if (b && !b.disabled) openDay(b.getAttribute('data-day'));
  });

  // ---------- 操作：詳細紀錄 ----------
  document.getElementById('logList').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-act]');
    if (!b || b.disabled || !editing) return;
    var id = b.getAttribute('data-id'), e = byId(id), sets = editing.sets[id];
    if (!e || !sets) return;
    var act = b.getAttribute('data-act');
    var i = parseInt(b.getAttribute('data-i'), 10);
    var n = parseInt(b.getAttribute('data-v'), 10);
    if (act === 'lw' && sets[i]) sets[i][0] = Math.min(MAX_TENTHS, Math.max(0, sets[i][0] + n * e.step));
    else if (act === 'lr' && sets[i]) sets[i][1] = Math.min(MAX_REPS, Math.max(0, sets[i][1] + n));
    else if (act === 'ldel' && sets[i]) sets.splice(i, 1);
    else if (act === 'ladd' && sets.length < MAX_SETS) {
      var last = sets[sets.length - 1], v = state.ex[id];
      sets.push(last ? last.slice() : [v.w, v.r]);
    } else return;
    var old = document.querySelector('[data-lcard="' + id + '"]');
    if (old) old.replaceWith(logCard(e));
  });
  document.getElementById('saveLog').addEventListener('click', function () { if (editing) saveLog(); });
  document.getElementById('cancelLog').addEventListener('click', function () { editing = null; showView(returnView); });

  // ---------- 操作：筆記 ----------
  document.getElementById('logNote').addEventListener('input', function () { updateCount(this, 'logNoteCount'); });
  document.getElementById('noteInput').addEventListener('input', function () { updateCount(this, 'noteCount'); });
  document.getElementById('noteCancel').addEventListener('click', closeNote);
  noteModal.addEventListener('click', function (ev) { if (ev.target === noteModal) closeNote(); });
  document.getElementById('noteSave').addEventListener('click', function () {
    if (!noteDay) return;
    setNote(noteDay, document.getElementById('noteInput').value);
    save(); closeNote(); renderCurrent();
  });
  document.getElementById('noteDelete').addEventListener('click', function () {
    if (!noteDay) return;
    delete state.note[noteDay];
    save(); closeNote(); renderCurrent();
  });

  // ---------- 操作：體重 ----------
  document.getElementById('bwChip').addEventListener('click', function () { openBw(weekKey(today()), false); });
  document.getElementById('bwList').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-bw]');
    if (b) openBw(b.getAttribute('data-bw'), false);
  });
  document.getElementById('bwLater').addEventListener('click', closeBw);
  bwModal.addEventListener('click', function (ev) { if (ev.target === bwModal) closeBw(); });
  function doSaveBw() {
    var v = parseBw(document.getElementById('bwInput').value);
    if (v === null) { document.getElementById('bwErr').textContent = '請輸入 20 到 300 之間的數字，例如 70.5'; return; }
    state.bw[bwWeek] = v; save(); closeBw(); renderCurrent();
  }
  document.getElementById('bwSave').addEventListener('click', doSaveBw);
  document.getElementById('bwInput').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') doSaveBw(); });
  document.getElementById('bwClear').addEventListener('click', function () {
    delete state.bw[bwWeek]; save(); closeBw(); renderCurrent();
  });

  // ---------- 操作：設定頁 ----------
  document.querySelector('#settingsView .switch').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-g]');
    if (!b) return;
    settingsGroup = b.getAttribute('data-g');
    renderSettings();
  });

  document.getElementById('list').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-act]');
    if (!b || b.disabled) return;
    var id = b.getAttribute('data-id');
    var e = byId(id), v = state.ex[id];
    if (!e || !v) return;
    var act = b.getAttribute('data-act');
    var n = parseInt(b.getAttribute('data-v'), 10);
    if (act === 'w') v.w = Math.min(MAX_TENTHS, Math.max(0, v.w + n * e.step));
    else if (act === 'r' && REPS.indexOf(n) !== -1) v.r = n;
    else if (act === 's' && SETS.indexOf(n) !== -1) v.s = n;
    else return;
    save();
    var old = document.querySelector('[data-card="' + id + '"]');
    if (old) old.replaceWith(card(e));
  });

  var resetModal = document.getElementById('resetModal');
  document.getElementById('resetBtn').addEventListener('click', function () { resetModal.classList.add('open'); });
  document.getElementById('cancelReset').addEventListener('click', function () { resetModal.classList.remove('open'); });
  resetModal.addEventListener('click', function (ev) { if (ev.target === resetModal) resetModal.classList.remove('open'); });
  document.getElementById('confirmReset').addEventListener('click', function () {
    var keep = state;
    state = defaults();
    ['group', 'log', 'detail', 'bw', 'note', 'cheer'].forEach(function (f) { state[f] = keep[f]; });
    save(); renderSettings();
    resetModal.classList.remove('open');
  });

  // 跨過午夜或從背景回來時更新日期
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    var k = keyOf(today());
    if (k !== todayKey) { todayKey = k; renderCurrent(); }
  });

  save();          // 寫入清理過／轉換過的資料
  renderMain();
})();
</script>
</body>
</html>
